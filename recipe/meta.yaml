{% set name = "ago" %}
{% set version = "0.1.1" %}
{% set bundle = "tar.gz" %}
{% set hash = "7b09d70d3b698bd7dd6ed952583430943b91569068deb2a180480e411bc90c47" %}
{% set build = 0 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ bundle }}
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ bundle }}
  sha256: {{ hash }}

build:
  noarch: python
  number: {{ build }}
  script: python setup.py install --single-version-externally-managed --record=record.txt

requirements:
  build:
    - python
    - setuptools

  run:
    - python

test:
  imports:
    - ago

about:
  home: https://bitbucket.org/russellballestrini/ago/
  # No license file, just stated in README.rst
  license_file: README.rst
  license: Public Domain
  license_family: OTHER
  summary: 'ago: Human readable timedeltas'
  dev_url: https://bitbucket.org/russellballestrini/ago/
  doc_url: https://bitbucket.org/russellballestrini/ago/

extra:
  recipe-maintainers:
    - pmlandwehr
